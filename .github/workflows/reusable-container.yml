# Reusable secure container build: build → push (GHCR) → SBOM (Syft, attached as attestation) → vulnerability scan
# (Grype, SARIF + gate) → cosign keyless signature → SLSA build provenance (GitHub artifact attestations) → verify.
# Call it from any repo:
#   uses: slackerwx/homelab-supply-chain/.github/workflows/reusable-container.yml@v1
name: reusable-container
on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name without registry, e.g. homelab-finops (pushed to ghcr.io/<owner>/<image_name>)"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile (relative to the repository root)"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        description: "Target platforms"
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Push to the registry (false = build + scan only, e.g. on pull requests)"
        required: false
        type: boolean
        default: true
      fail_on_severity:
        description: "Grype severity that fails the build: negligible|low|medium|high|critical"
        required: false
        type: string
        default: "critical"
    outputs:
      image:
        description: "Fully qualified image reference by digest (registry/name@sha256:...)"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Image digest"
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: "Tags pushed"
        value: ${{ jobs.build.outputs.tags }}

permissions: {}

jobs:
  build:
    name: build · sbom · scan · sign · attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push image, signature, SBOM attestation, provenance
      id-token: write          # keyless signing (Sigstore Fulcio) + attestations
      attestations: write      # actions/attest-build-provenance
      security-events: write   # SARIF upload
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Image metadata (tags: sha7, branch, semver)"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # we produce SBOM/provenance ourselves (single manifest digest, cosign-friendly)
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest reference
        id: ref
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            echo "image=${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${IMAGE}:local" >> "$GITHUB_OUTPUT"
          fi

      - name: SBOM (Syft → SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ inputs.push && steps.ref.outputs.image || format('{0}:local', env.IMAGE) }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          artifact-name: sbom-${{ inputs.image_name }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.image_name }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Vulnerability scan (Grype, SARIF, gate on ${{ inputs.fail_on_severity }})
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: ${{ inputs.fail_on_severity }}
          output-format: sarif
          output-file: grype.sarif
        continue-on-error: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          sarif_file: grype.sarif
        continue-on-error: true      # code scanning may be unavailable on private repos without GHAS

      - name: Fail on vulnerabilities above the gate
        if: steps.grype.outcome == 'failure'
        run: |
          echo "::error::Grype found vulnerabilities at or above severity '${{ inputs.fail_on_severity }}' — see the SARIF/report above."
          exit 1

      - name: Install cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image (cosign keyless, GitHub OIDC)
        if: ${{ inputs.push }}
        env:
          COSIGN_YES: "true"
        run: cosign sign --recursive "${{ steps.ref.outputs.image }}"

      - name: Attach SBOM as attestation (cosign attest, predicate spdxjson)
        if: ${{ inputs.push }}
        env:
          COSIGN_YES: "true"
        run: cosign attest --type spdxjson --predicate sbom.spdx.json "${{ steps.ref.outputs.image }}"

      - name: SLSA build provenance (GitHub artifact attestation, pushed to the registry)
        if: ${{ inputs.push }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify:
    name: verify signature · sbom · provenance
    if: ${{ inputs.push }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write          # cosign verify (Rekor/Fulcio trust root)
      attestations: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Login to GHCR (private packages)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: cosign verify (identity = this reusable workflow, issuer = GitHub Actions)
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository_owner }}/[^/]+/\.github/workflows/[^@]+@refs/(heads/main|tags/v[0-9]+(\.[0-9]+)*)$' \
            "${{ needs.build.outputs.image }}" | head -c 2000
      - name: cosign verify-attestation (SBOM present and signed)
        run: |
          cosign verify-attestation --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository_owner }}/' \
            "${{ needs.build.outputs.image }}" | jq -r '.payloadType' | head -1
      - name: gh attestation verify (SLSA provenance)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify "oci://${{ needs.build.outputs.image }}" --owner "${{ github.repository_owner }}"
