# Reusable secure container build: build → push (GHCR) → SBOM (Syft, attached as attestation) → vulnerability scan
# (Grype, SARIF + gate) → cosign keyless signature → SLSA build provenance (GitHub artifact attestations) → verify.
# Call it from any repo:
#   uses: slackerwx/platform-supply-chain/.github/workflows/reusable-container.yml@v1
name: reusable-container
on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name without registry, e.g. platform-finops (pushed to ghcr.io/<owner>/<image_name>)"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile (relative to the repository root)"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        description: "Target platforms"
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Push to the registry (false = build + scan only, e.g. on pull requests)"
        required: false
        type: boolean
        default: true
      fail_on_severity:
        description: "Grype severity that fails the build: negligible|low|medium|high|critical"
        required: false
        type: string
        default: "critical"
      attest_provenance:
        description: >-
          Attach SLSA build provenance. GitHub refuses to issue build attestations to user-owned private
          repositories, so a private caller on a personal account must pass false — it keeps the signature and
          the SBOM and loses only the provenance. Public repos and Team/Enterprise plans should leave this true.
        required: false
        type: boolean
        default: true
      only_fixed:
        description: >-
          Gate only on vulnerabilities that have a fix available. Un-fixable CVEs still appear in the full
          report and in the attested SBOM — they just do not block a build that has no way to pass.
        required: false
        type: boolean
        default: true
    outputs:
      image:
        description: "Fully qualified image reference by digest (registry/name@sha256:...)"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Image digest"
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: "Tags pushed"
        value: ${{ jobs.build.outputs.tags }}

permissions: {}

jobs:
  build:
    name: build · sbom · scan · sign · attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push image, signature, SBOM attestation, provenance
      id-token: write          # keyless signing (Sigstore Fulcio) + attestations
      attestations: write      # actions/attest-build-provenance
      security-events: write   # SARIF upload
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Image metadata (tags: sha7, branch, semver)"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # we produce SBOM/provenance ourselves (single manifest digest, cosign-friendly)
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reference to describe, scan and sign
        id: ref
        env:
          # Interpolating tags straight into the script would let a fork's branch name inject shell.
          PUSH: ${{ inputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ "$PUSH" = "true" ]; then
            # By digest: a signature must bind to the immutable manifest, never to a movable tag.
            echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            # `load: true` puts the metadata-action tags in the local daemon — the first one is what exists.
            echo "image=$(printf '%s\n' "$TAGS" | head -n1)" >> "$GITHUB_OUTPUT"
          fi

      - name: SBOM (Syft → SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          artifact-name: sbom-${{ inputs.image_name }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.image_name }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Vulnerability scan (Grype, SARIF, gate on ${{ inputs.fail_on_severity }})
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: ${{ inputs.fail_on_severity }}
          only-fixed: ${{ inputs.only_fixed }}
          output-format: sarif
          output-file: grype.sarif
        continue-on-error: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          sarif_file: grype.sarif
        # Public repos get code scanning for free; a private caller without GHAS has the upload rejected, and
        # that must not fail its build — the gate below is what enforces, not the upload.
        continue-on-error: true

      # Gating and reporting are different jobs. The gate above blocks on what the build can actually act on;
      # this one hides nothing, so an un-fixable CVE stays visible instead of being quietly filtered away.
      - name: Full vulnerability report (every severity, fixable or not)
        if: always()
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.spdx.json
          fail-build: false
          only-fixed: false
          output-format: table
          output-file: grype-full.txt
        continue-on-error: true

      - name: Publish the vulnerability report to the job summary
        if: always()
        env:
          GATE: ${{ inputs.fail_on_severity }}
          ONLY_FIXED: ${{ inputs.only_fixed }}
        run: |
          {
            echo "### Vulnerabilities — ${IMAGE}"
            echo ""
            echo "Gate: fail on \`${GATE}\` and above, only-fixed \`${ONLY_FIXED}\`."
            echo ""
            echo '```'
            cat grype-full.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerabilities-${{ inputs.image_name }}
          path: grype-full.txt
          retention-days: 90
        continue-on-error: true

      - name: Fail on vulnerabilities above the gate
        if: steps.grype.outcome == 'failure'
        env:
          GATE: ${{ inputs.fail_on_severity }}
          ONLY_FIXED: ${{ inputs.only_fixed }}
        run: |
          echo "::error::Grype found vulnerabilities at or above '${GATE}' (only-fixed=${ONLY_FIXED}) — see the report in the job summary."
          exit 1

      - name: Install cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image (cosign keyless, GitHub OIDC)
        if: ${{ inputs.push }}
        env:
          COSIGN_YES: "true"
        run: cosign sign --recursive "${{ steps.ref.outputs.image }}"

      - name: Attach SBOM as attestation (cosign attest, predicate spdxjson)
        if: ${{ inputs.push }}
        env:
          COSIGN_YES: "true"
        run: cosign attest --type spdxjson --predicate sbom.spdx.json "${{ steps.ref.outputs.image }}"

      - name: SLSA build provenance (GitHub artifact attestation, pushed to the registry)
        if: ${{ inputs.push && inputs.attest_provenance }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Opting out of provenance is a real reduction in what this image can prove. Say so where people look,
      # rather than letting a missing attestation pass for a complete chain.
      - name: Record that this image ships without provenance
        if: ${{ inputs.push && !inputs.attest_provenance }}
        run: |
          {
            echo "### ⚠️ No SLSA provenance for \`${IMAGE}\`"
            echo ""
            echo "\`attest_provenance: false\` — this image is **signed** and carries a **signed SBOM**, but"
            echo "nothing attests which workflow and commit produced it. GitHub issues build attestations only to"
            echo "public repositories and to Team/Enterprise plans; a user-owned private repository cannot have one."
            echo ""
            echo "To restore it: make the repository public, or move it to an organisation on a Team plan."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Image published without SLSA provenance (attest_provenance=false)."

  verify:
    name: verify signature · sbom · provenance
    if: ${{ inputs.push }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write          # cosign verify (Rekor/Fulcio trust root)
      attestations: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Login to GHCR (private packages)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: cosign verify (identity = this reusable workflow, issuer = GitHub Actions)
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository_owner }}/[^/]+/\.github/workflows/[^@]+@refs/(heads/main|tags/v[0-9]+(\.[0-9]+)*)$' \
            "${{ needs.build.outputs.image }}" | head -c 2000
      - name: cosign verify-attestation (SBOM present and signed)
        run: |
          cosign verify-attestation --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository_owner }}/' \
            "${{ needs.build.outputs.image }}" | jq -r '.payloadType' | head -1
      - name: gh attestation verify (SLSA provenance)
        if: ${{ inputs.attest_provenance }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify "oci://${{ needs.build.outputs.image }}" --owner "${{ github.repository_owner }}"
