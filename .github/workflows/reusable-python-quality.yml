# Reusable Python quality gate: uv sync, ruff (lint + format), mypy, pytest with coverage.
name: reusable-python-quality
on:
  workflow_call:
    inputs:
      working-directory: {required: false, type: string, default: "."}
      python-version: {required: false, type: string, default: "3.12"}
      run-mypy: {required: false, type: boolean, default: true}
permissions: {}
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: "0.12.5"}
      - run: uv python install ${{ inputs.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - if: ${{ inputs.run-mypy }}
        run: uv run mypy
      - run: uv run pytest -q --cov --cov-report=term-missing
