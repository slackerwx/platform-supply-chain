[project]
name = "hello-supply-chain"
version = "0.1.0"
description = "Tiny stdlib-only service whose image proves the supply-chain pipeline end to end"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Intentionally no runtime dependencies: the SBOM stays small enough to read by hand.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hello"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["hello"]

[tool.coverage.report]
show_missing = true
